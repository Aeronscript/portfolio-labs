<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#251645"/>
      <stop offset="1" stop-color="#0d0818"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Tuile violet-noir profond -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#glow)"/>

  <!-- Anneau dégradé fin -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <!-- « A » — monogramme Aeronscript (lumière venant du haut) -->
  <polygon points="19,52 32,12 45,52 38.5,52 32,23 25.5,52" fill="url(#aGrad)"/>
  <rect x="24" y="38" width="12.5" height="4.5" rx="2.25" fill="url(#aGrad)"/>

  <!-- « + » — badge supérieur droit, comme un A⁺ -->
  <rect x="43.5" y="8" width="4" height="15" rx="2" fill="#e9d5ff"/>
  <rect x="37" y="12.5" width="17" height="4" rx="2" fill="#e9d5ff"/>
</svg>
